[workspace]
authors = ["Elmo van den Beld <elmo.vandenbeld@wur.nl>"]
channels = ["conda-forge"]
name = "project-starter-Mangrove_forest_Hainan"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
mangrovesdownload = "python MangroveWatch/mangroves_download.py"

[dependencies]
python = ">=3.14.7,<3.15"
pandas = ">=3.0.6,<4"
numpy = ">=2.5.3,<3"
rasterio = ">=1.5.1,<2"
shapely = ">=2.1.2,<3"
geopandas = ">=1.2.0,<2"
pystac-client = ">=0.9.0,<0.10"
planetary-computer = ">=1.0.0,<2"
rioxarray = ">=0.23.0,<0.24"
matplotlib = ">=3.11.2,<4"
odc-stac = ">=0.5.3,<0.6"
stackstac = ">=0.5.0,<0.6"
leafmap = ">=0.63.1,<0.64"
patool = ">=4.1.0,<5"
p7zip = ">=16.2,<17"
unrar = ">=0.4,<0.5"

[pypi-dependencies]
pillow = ">=11"
sits = ">=0.5.1, <0.6"
pystac-client = "*"
planetary-computer = ">=1.0.0, <2"
odc-stac = ">=0.5.3, <0.6"
